[package]
name = "slab-proto"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[build-dependencies]
tonic-prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true , features = ["json"] }
serde_repr = { workspace = true }
# Harness protocol contracts (thread/turn/item model). Transport-agnostic:
# the JSON-RPC envelope types live in `slab-jsonrpc` and are applied by the
# server dispatcher, so this crate does NOT depend on `slab-jsonrpc`.
schemars = { workspace = true }
strum = { workspace = true }
