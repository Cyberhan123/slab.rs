name: Setup FFmpeg (prebuilt static)
description: >-
  Install a prebuilt static FFmpeg (BtbN linux64-gpl, PIC-built) and export
  FFMPEG_DIR. Ubuntu's libav*-dev packages declare the full optional-dependency
  web of the distro build in their pkg-config Libs lines, so linking against
  them drags in ~100 unrelated system libraries. A hermetic static build keeps
  the link line down to the libav archives themselves.
runs:
  using: composite
  steps:
    - name: Cache FFmpeg
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/ffmpeg
        key: ffmpeg-n8.1-linux64-gpl-8.1-v1

    - name: Download FFmpeg
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl --location --fail --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
        mkdir -p "$HOME/ffmpeg"
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$HOME/ffmpeg" --strip-components=1

    - name: Export FFMPEG_DIR
      if: runner.os == 'Linux'
      shell: bash
      run: echo "FFMPEG_DIR=$HOME/ffmpeg" >> "$GITHUB_ENV"
