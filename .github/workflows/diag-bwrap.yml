name: Diagnose bwrap on runner
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev >/dev/null
          set -x
          command -v bwrap || true
          bwrap --version || true
          dpkg -l | grep -i bubble || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          aa-status 2>/dev/null | head -3 || true
          # full driver argv shape
          bwrap --die-with-parent --new-session --unshare-user --unshare-pid --unshare-net \
            --proc /proc --dev /dev --ro-bind / / --tmpfs /tmp -- \
            /usr/bin/env -i /bin/bash -c 'echo BWRAP_FULL_OK'; echo "rc=$?"
          # without --unshare-net (loopback setup is netns-only)
          bwrap --die-with-parent --new-session --unshare-user --unshare-pid \
            --proc /proc --dev /dev --ro-bind / / --tmpfs /tmp -- \
            /usr/bin/env -i /bin/bash -c 'echo BWRAP_NONETNS_OK'; echo "rc=$?"
          # without --unshare-user
          bwrap --die-with-parent --new-session --unshare-pid --unshare-net \
            --proc /proc --dev /dev --ro-bind / / --tmpfs /tmp -- \
            /usr/bin/env -i /bin/bash -c 'echo BWRAP_NOUSERNS_OK'; echo "rc=$?"
