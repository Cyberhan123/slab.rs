name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  cargo-check:
    name: Cargo - check / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev
          # libwebkit2gtk pulls bubblewrap in, and Ubuntu 24.04's AppArmor
          # userns restriction makes bwrap's in-netns loopback setup fail with
          # EPERM ("loopback: Failed RTM_NEWADDR"). The runner is an ephemeral
          # single-tenant VM, so lift the restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Apply patches (vendor setup)
        run: bun run scripts/apply-patches.ts

      - name: cargo check
        run: bun ./scripts/cargo/validate.ts check

      - name: cargo fmt
        run: bun ./scripts/cargo/validate.ts fmt

      - name: cargo clippy
        run: bun ./scripts/cargo/validate.ts clippy

      - name: cargo doc
        run: bun ./scripts/cargo/validate.ts doc

      - name: cargo test
        run: bun ./scripts/cargo/validate.ts test

  frontend-check:
    name: Frontend contract / test / bundle gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Bun install artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply patches (vendor setup)
        run: bun run scripts/apply-patches.ts

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler pkg-config

      - name: Setup uv
        # gen:api regenerates the Python SDK through `uvx openapi-python-client`.
        uses: astral-sh/setup-uv@v5

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Check API type drift
        run: |
          bun run gen:api
          git diff --exit-code packages/api/src/v1.d.ts python/slab-python-sdk/src/slab_api_client

      - name: Check harness bindings drift
        run: |
          bun run gen:harness
          git diff --exit-code packages/api/src/harness

      - name: Check settings/schema drift
        run: |
          bun run gen:schemas
          git diff --exit-code docs/public/manifests/v1/settings-document.schema.json docs/public/manifests/v3/slab-manifest.schema.json

      # Plugin packs are build artifacts (plugins/dist is gitignored), so this
      # is a build-sanity gate: it fails the PR if a plugin manifest/shape change
      # breaks packing. There is no diff to check against tracked source.
      - name: Check plugin packs build
        run: bun run gen:plugin-packs

      # Plan F PR gate: contract/schema drift, frontend build, deterministic
      # unit tests, browser-mode regressions, and bundle budget. Fullstack E2E
      # stays in the release/manual workflow to keep ordinary PR feedback tight.
      - name: Type-check frontend packages
        run: bun run check:frontend

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run frontend tests
        run: bun run test:frontend

      - name: Run browser regression tests
        run: bun run test:browser

      - name: Check desktop bundle budget
        run: bun run check:bundle-budget

  mobile-check:
    name: Mobile (Flutter) asset drift / analyze / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the dev toolchain: pubspec dev deps
          # (build_runner ^2.16.0, drift_dev) require Dart >=3.11, which
          # ships with Flutter >=3.47.
          flutter-version: 3.47.1
          cache: true

      - name: Regenerate mobile assets (tokens + locales)
        run: bun run gen:mobile

      - name: Check generated drift
        run: |
          git diff --exit-code flutter/slab-mobile/design/tokens.json \
            flutter/slab-mobile/lib/core/theme/slab_tokens.g.dart \
            flutter/slab-mobile/assets/theme/tdesign-theme.json \
            flutter/slab-mobile/lib/core/l10n/arb \
            flutter/slab-mobile/lib/core/l10n/catalog_entries.g.dart

      - name: flutter pub get
        run: bun ./scripts/mobile/run.ts pub get

      - name: flutter analyze
        run: bun run check:mobile

      - name: flutter test
        run: bun run test:mobile

  fullstack-e2e:
    name: Fullstack E2E (manual / nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            python3-dev \
            libglib2.0-dev

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply patches (vendor setup)
        run: bun run scripts/apply-patches.ts

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run release-risk fullstack E2E
        run: bun run test:e2e
