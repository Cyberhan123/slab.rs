name: Seed linux browser baselines

# One-shot: the committed screenshot references are all chromium-win32;
# CI's browser regression gate needs chromium-linux references, which can
# only be rendered on the CI image itself. Run with --update new to write
# only the missing references, then push them back to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply patches (vendor setup)
        run: bun run scripts/apply-patches.ts

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Seed missing linux screenshots
        run: bun run test:browser -- --update new

      - name: Commit new baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '**/__screenshots__/**/*.png'
          if git diff --cached --quiet; then
            echo "no new baselines to commit"
            exit 0
          fi
          git commit -m "chore(browser): seed chromium-linux screenshot baselines"
          git push
