name: Catalog Updates

# Automated updates for Bun's `catalog:` protocol.
# Dependabot does not support the bun `catalog:` protocol (dependabot-core#12522),
# so this action (brandhaug/catalog-update-action) owns version bumps for the
# central `catalog` field in the root package.json.
#
# NOTE: PRs opened with the default GITHUB_TOKEN do not trigger downstream CI
# (ci.yml). If you want CI to run on these PRs, switch to a GitHub App token —
# see https://github.com/marketplace/actions/catalog-dependency-updater

on:
  schedule:
    - cron: '30 2 * * 1' # Every Monday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Run catalog update
        uses: brandhaug/catalog-update-action@v1
        with:
          config: '.catalog-updaterc.json'
          dry-run: 'false'
