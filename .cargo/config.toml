[env]

[build]

[profile.dev]
incremental = false

[profile.test]
incremental = false

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
    "-C", "link-arg=/STACK:8388608",
    "-C", "target-feature=+crt-static",
    # MSVC link.exe prints "Creating library ... and object ..." for every artifact
    # (rustc always passes /IMPLIB on this target). It's noise, not a real warning.
    "-A", "linker_messages",
]
